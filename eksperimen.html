<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksperimen Mandiri</title>
    <link rel="stylesheet" href="style.css">
    <script src="script-eksperimen.js" defer></script>
</head>
<body>
    <h1>Eksperimen Mandiri (Praktikum 6)</h1>

    <!-- Eksperimen 1: Tombol Hapus pada To-Do List -->
    <section>
        <h2>Eksperimen 1: Hapus Item To-Do List</h2>
        <input id="inputEks" type="text" placeholder="Tugas baru...">
        <button id="tambahEks" type="button">Tambah</button>
        <ul id="daftarEks"></ul>
    </section>

    <!-- Eksperimen 4: Sembunyikan & Tampilkan Paragraf -->
    <section>
        <h2>Eksperimen 4: Hide/Show Paragraf</h2>
        <p id="paragrafTeks">Paragraf ini bisa disembunyikan dan ditampilkan kembali.</p>
        <button id="btnToggle" type="button">Sembunyikan / Tampilkan</button>
    </section>
</body>
</html>
